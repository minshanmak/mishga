<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="noindex,nofollow" name="robots"/>
  <title>
   MishGa Console — Projects
  </title>
  <link href="assets/mishga-logo.png" rel="icon" type="image/png"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <link href="css/admin.css" rel="stylesheet"/>
 </head>
 <body class="console-body">
  <main class="console">
   <aside class="console-sidebar">
    <a class="brand" href="/">
     <img alt="MishGa" src="assets/mishga-logo.png"/>
     <span>
      Mish
      <span>
       Ga
      </span>
     </span>
    </a>
    <p class="console-label">
     Workspace
    </p>
    <nav>
     <a href="/dashboard">
      <i class="fa-solid fa-inbox">
      </i>
      <span>
       Enquiries
      </span>
     </a>
     <a class="selected" href="/projects">
      <i class="fa-solid fa-layer-group">
      </i>
      <span>
       Projects
      </span>
     </a>
     <a href="/">
      <i class="fa-solid fa-arrow-up-right-from-square">
      </i>
      <span>
       View website
      </span>
     </a>
    </nav>
    <div class="sidebar-user">
     <span class="user-avatar">
      MG
     </span>
     <span>
      <strong>
       MishGa Admin
      </strong>
      <small>
       Administrator
      </small>
     </span>
     <button aria-label="Log out" id="logoutButton">
      <i class="fa-solid fa-arrow-right-from-bracket">
      </i>
     </button>
    </div>
   </aside>
   <section class="console-main">
    <header class="console-header">
     <div>
      <p class="eyebrow">
       <span>
       </span>
       Portfolio
      </p>
      <h1>
       Manage projects
      </h1>
      <p>
       Add published work to feature it on your website.
      </p>
     </div>
     <button aria-label="Toggle navigation" class="mobile-menu" id="mobileMenu">
      <i class="fa-solid fa-bars">
      </i>
     </button>
    </header>
    <div class="project-layout">
     <form class="project-form" id="projectForm">
      <div class="form-title">
       <h2 id="formHeading">
        Add a project
       </h2>
       <button hidden="" id="cancelEdit" type="button">
        Cancel edit
       </button>
      </div>
      <input id="projectId" type="hidden"/>
      <label>
       Project title
       <input id="projectTitle" placeholder="e.g. Smart Venue" required=""/>
      </label>
      <label>
       Description
       <textarea id="projectDescription" placeholder="What did you build and why?" required="" rows="5"></textarea>
      </label>
      <label>
       Technologies
       <small>
        Separate with commas
       </small>
       <input id="projectTechnologies" placeholder="Flask, SQLite, Responsive"/>
      </label>
      <div class="project-url-row">
       <label>
        Live project URL
        <input id="projectLiveUrl" placeholder="https://..." type="url"/>
       </label>
       <label>
        Case study URL
        <input id="projectCaseStudyUrl" placeholder="https://..." type="url"/>
       </label>
      </div>
      <label class="publish-toggle">
       <input checked="" id="projectPublished" type="checkbox"/>
       <span>
       </span>
       Publish on website
      </label>
      <button class="btn btn-gold" type="submit">
       <i class="fa-solid fa-plus">
       </i>
       <span id="saveLabel">
        Add project
       </span>
      </button>
      <p aria-live="polite" class="project-feedback">
      </p>
     </form>
     <section class="project-list-wrap">
      <div class="project-list-heading">
       <h2>
        Your projects
       </h2>
       <span id="projectCount">
        0 projects
       </span>
      </div>
      <div class="project-list" id="projectList">
      </div>
      <div class="empty-state" id="projectEmpty">
       <div>
        <i class="fa-solid fa-layer-group">
        </i>
       </div>
       <h3>
        Build your portfolio
       </h3>
       <p>
        Add your first project using the form.
       </p>
      </div>
     </section>
    </div>
   </section>
  </main>
  <template id="projectTemplate">
   <article class="project-admin-card">
    <div class="project-card-top">
     <span class="project-mark">
      <i class="fa-solid fa-gem">
      </i>
     </span>
     <div>
      <h3>
      </h3>
      <span class="project-status">
      </span>
     </div>
     <button class="project-menu" title="Edit project">
      <i class="fa-solid fa-pen">
      </i>
     </button>
    </div>
    <p class="project-card-description">
    </p>
    <div class="project-tags">
    </div>
    <div class="project-card-actions">
     <a class="visit-project" rel="noopener" target="_blank">
      Visit
      <i class="fa-solid fa-arrow-up-right-from-square">
      </i>
     </a>
     <button class="delete-project">
      Delete
     </button>
    </div>
   </article>
  </template>
  <script src="js/projects.js">
  </script>
 </body>
</html>
